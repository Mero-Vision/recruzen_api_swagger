  /api/admin/assistant/ask:
    post:
      tags:
        - Admin > HR Assistant
      summary: ask question
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                question:
                  type: string
                  example: list me employees data
                conversation_id:
                  type: integer
                  example: '14'
      security:
        - bearerAuth: []
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
        - name: branch-id
          in: header
          schema:
            type: integer
          example: '1'
      responses:
        '200':
          description: OK
          headers:
            Host:
              schema:
                type: string
                example: 127.0.0.1:8000
            Connection:
              schema:
                type: string
                example: close
            X-Powered-By:
              schema:
                type: string
                example: PHP/8.3.0
            Cache-Control:
              schema:
                type: string
                example: no-cache, private
            Date:
              schema:
                type: string
                example: Sat, 07 Mar 2026 12:41:11 GMT
            Content-Type:
              schema:
                type: string
                example: application/json
            X-RateLimit-Limit:
              schema:
                type: integer
                example: '120'
            X-RateLimit-Remaining:
              schema:
                type: integer
                example: '119'
            X-Content-Type-Options:
              schema:
                type: string
                example: nosniff
            X-Frame-Options:
              schema:
                type: string
                example: DENY
            X-XSS-Protection:
              schema:
                type: string
                example: 1; mode=block
            Strict-Transport-Security:
              schema:
                type: string
                example: max-age=31536000; includeSubDomains; preload
            Referrer-Policy:
              schema:
                type: string
                example: strict-origin-when-cross-origin
            Permissions-Policy:
              schema:
                type: string
                example: geolocation=(), microphone=(), camera=()
            Content-Security-Policy:
              schema:
                type: string
                example: default-src 'self'
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
          content:
            text/plain:
              schema:
                type: string
              example: |-
                {
                    "data": {
                        "conversation_id": 12,
                        "answer": "Based on the HR data, here's the list of projects:\n\n| # | Project Name | Type | Status | Start Date | End Date | Budget | Client | Members |\n|---|--------------|------|--------|------------|----------|--------|--------|---------|\n| 1 | Recruzen | Fixed | Planning | 2025-12-12 | 2026-01-20 | ₹10,000.00 | Mero Vision Pvt. Ltd | 0 |\n| 2 | Recruzen | Fixed | Planning | 2025-12-12 | 2026-01-20 | ₹10,000.00 | Mero Vision Pvt. Ltd | 0 |\n\n### Summary:\n- **Total Projects:** 2\n- **Active Projects:** 0\n- **Status:** Both projects are in \"Planning\" stage\n- **Total Budget:** ₹20,000.00"
                    }
                }
